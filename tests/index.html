<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQE1 Practice Tests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --n0:  #2E3440;
      --n1:  #3B4252;
      --n2:  #434C5E;
      --n3:  #4C566A;
      --n4:  #D8DEE9;
      --n5:  #E5E9F0;
      --n6:  #ECEFF4;
      --n7:  #8FBCBB;
      --n8:  #88C0D0;
      --n9:  #81A1C1;
      --n10: #5E81AC;
      --n11: #BF616A;
      --n12: #D08770;
      --n13: #EBCB8B;
      --n14: #A3BE8C;
      --n15: #B48EAD;
      --shadow: 0 2px 16px rgba(0,0,0,0.35);
      --radius: 10px;
    }

    html { font-size: 18px; }
    @media (max-width: 768px) { html { font-size: 15px; } }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--n0);
      color: var(--n4);
      min-height: 100vh;
    }

    #app { min-height: 100vh; }

    /* ── HOME ─────────────────────────────────────────────── */
    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(145deg, var(--n0) 0%, var(--n1) 100%);
    }
    .home-logo {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--n6);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .home-logo span { color: var(--n8); }
    .home-sub {
      color: var(--n9);
      font-size: 0.92rem;
      margin-bottom: 48px;
      text-align: center;
    }
    .home-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
    }
    .flk-card {
      background: var(--n1);
      border: 2px solid var(--n3);
      border-radius: 16px;
      padding: 34px 44px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      flex: 1 1 280px;
      max-width: 340px;
      color: var(--n4);
    }
    .flk-card:hover {
      background: var(--n2);
      border-color: var(--n8);
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    .flk-card h2 { font-size: 2rem; font-weight: 800; color: var(--n6); margin-bottom: 6px; }
    .flk-card .flk-count { font-size: 1rem; color: var(--n8); margin-bottom: 14px; }
    .flk-card .flk-topics { font-size: 0.78rem; color: var(--n4); line-height: 1.85; }
    .home-footer {
      margin-top: 40px;
      color: var(--n3);
      font-size: 0.72rem;
      text-align: center;
      line-height: 1.7;
    }
    .home-footer a { color: var(--n9); text-decoration: none; }
    .home-footer a:hover { text-decoration: underline; }

    /* ── BROWSE ───────────────────────────────────────────── */
    .browse-wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
    .browse-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-top: 14px;
    }
    .btn-back {
      background: none;
      border: 2px solid var(--n9);
      color: var(--n9);
      padding: 7px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-back:hover { background: var(--n9); color: var(--n0); }
    .browse-title { font-size: 1.5rem; font-weight: 800; color: var(--n6); }
    .browse-subtitle { font-size: 0.82rem; color: var(--n4); }

    /* ── SECTION ──────────────────────────────────────────── */
    .section { margin-bottom: 28px; }
    .section-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: var(--n9);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .test-card {
      background: var(--n1);
      border: 1px solid var(--n3);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .test-card:hover {
      background: var(--n2);
      border-color: var(--n8);
      transform: translateX(4px);
    }

    .test-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .test-icon.official { background: rgba(163,190,140,0.18); color: var(--n14); }
    .test-icon.generated { background: rgba(136,192,208,0.18); color: var(--n8); }
    .test-icon.topic { background: rgba(180,142,173,0.18); color: var(--n15); }

    .test-info { flex: 1; min-width: 0; }
    .test-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--n5);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .test-meta {
      font-size: 0.74rem;
      color: var(--n4);
    }

    .test-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .test-badge.full {
      background: rgba(163,190,140,0.18);
      color: var(--n14);
      border: 1px solid rgba(163,190,140,0.3);
    }
    .test-badge.topic-b {
      background: rgba(180,142,173,0.15);
      color: var(--n15);
      border: 1px solid rgba(180,142,173,0.3);
    }
    .test-badge.gen {
      background: rgba(136,192,208,0.15);
      color: var(--n8);
      border: 1px solid rgba(136,192,208,0.3);
    }

    .test-arrow {
      color: var(--n3);
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .test-card:hover .test-arrow { color: var(--n8); }

    /* ── STATS BAR ────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .stat-pill {
      background: var(--n1);
      border: 1px solid var(--n3);
      border-radius: 10px;
      padding: 14px 20px;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .stat-pill .sp-num {
      display: block;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--n8);
    }
    .stat-pill .sp-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--n3);
    }

    @media (max-width: 480px) {
      .flk-card { padding: 26px 28px; min-width: 150px; }
      .test-card { padding: 14px 16px; gap: 12px; }
      .test-icon { width: 38px; height: 38px; font-size: 1rem; }
      .stats-bar { gap: 8px; }
      .stat-pill { padding: 10px 14px; }
    }
  </style>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
</head>
<body>
<div id="app"></div>
<script>

// ── Test Data ──────────────────────────────────────────────────────────────────
const TESTS = {
  flk1: {
    label: "FLK 1",
    subjects: ["Business Law", "Constitutional Law", "Contract", "Dispute Resolution", "Ethics", "Legal System", "Tort"],
    official: [
      { file: "flk1/official/SQE1 FLK1 – Full Practice Exam.html", title: "SQE1 FLK1 – Full Practice Exam", questions: 110, sessions: 2 }
    ],
    generated: [
      { file: "flk1/generated/SQE1 FLK1 – Generated Practice Exam.html", title: "Generated Practice Exam 1", questions: 180, sessions: 2 },
      { file: "flk1/generated/SQE1 FLK1 – Generated Practice Exam 2.html", title: "Generated Practice Exam 2", questions: 180, sessions: 2 },
      { file: "flk1/generated/SQE1 FLK1 – Generated Practice Exam 3.html", title: "Generated Practice Exam 3", questions: 180, sessions: 2 },
      { file: "flk1/generated/SQE1 FLK1 – Generated Practice Exam 4.html", title: "Generated Practice Exam 4", questions: 180, sessions: 2 },
      { file: "flk1/generated/SQE1 FLK1 – Generated Practice Exam 5.html", title: "Generated Practice Exam 5", questions: 180, sessions: 2 }
    ],
    topic: [
      { file: "flk1/topic/Business_Law_and_Practice.html", title: "Business Law & Practice", questions: 120 },
      { file: "flk1/topic/Constitutional_Administrative_and_EU_Law.html", title: "Constitutional & Administrative Law", questions: 100 },
      { file: "flk1/topic/Contract.html", title: "Contract", questions: 101 },
      { file: "flk1/topic/Dispute_Resolution.html", title: "Dispute Resolution", questions: 120 },
      { file: "flk1/topic/Ethics_and_Professional_Conduct.html", title: "Ethics & Professional Conduct", questions: 100 },
      { file: "flk1/topic/Legal_System.html", title: "Legal System", questions: 105 },
      { file: "flk1/topic/Tort.html", title: "Tort", questions: 120 }
    ]
  },
  flk2: {
    label: "FLK 2",
    subjects: ["Criminal Law", "Criminal Practice", "Land Law", "Property Practice", "Solicitors' Accounts", "Trusts", "Wills & Succession"],
    official: [
      { file: "flk2/official/SQE1 FLK2 – Full Practice Exam.html", title: "SQE1 FLK2 – Full Practice Exam", questions: 110, sessions: 2 }
    ],
    generated: [
      { file: "flk2/generated/SQE1 FLK2 – Generated Practice Exam.html", title: "Generated Practice Exam 1", questions: 180, sessions: 2 },
      { file: "flk2/generated/SQE1 FLK2 – Generated Practice Exam 2.html", title: "Generated Practice Exam 2", questions: 180, sessions: 2 },
      { file: "flk2/generated/SQE1 FLK2 – Generated Practice Exam 3.html", title: "Generated Practice Exam 3", questions: 180, sessions: 2 },
      { file: "flk2/generated/SQE1 FLK2 – Generated Practice Exam 4.html", title: "Generated Practice Exam 4", questions: 180, sessions: 2 },
      { file: "flk2/generated/SQE1 FLK2 – Generated Practice Exam 5.html", title: "Generated Practice Exam 5", questions: 180, sessions: 2 }
    ],
    topic: [
      { file: "flk2/topic/Criminal_Law.html", title: "Criminal Law", questions: 110 },
      { file: "flk2/topic/Criminal_Practice.html", title: "Criminal Practice", questions: 120 },
      { file: "flk2/topic/Land_Law.html", title: "Land Law", questions: 90 },
      { file: "flk2/topic/Property_Practice.html", title: "Property Practice", questions: 110 },
      { file: "flk2/topic/Solicitors_Accounts.html", title: "Solicitors' Accounts", questions: 100 },
      { file: "flk2/topic/Trusts.html", title: "Trusts", questions: 89 },
      { file: "flk2/topic/Wills_and_Succession.html", title: "Wills & Succession", questions: 90 }
    ]
  }
};

// ── State ──────────────────────────────────────────────────────────────────────
const state = { view: 'home', flk: null };

// ── Helpers ────────────────────────────────────────────────────────────────────
function totalQs(flk) {
  const d = TESTS[flk];
  let n = 0;
  ['official','generated','topic'].forEach(cat => d[cat].forEach(t => n += t.questions));
  return n;
}

function totalTests(flk) {
  const d = TESTS[flk];
  return d.official.length + d.generated.length + d.topic.length;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.view === 'home' ? renderHome() : renderBrowse();
  bindEvents();
}

function renderHome() {
  const allTests = totalTests('flk1') + totalTests('flk2');
  const allQs = totalQs('flk1') + totalQs('flk2');

  function flkCard(key) {
    const d = TESTS[key];
    const tests = totalTests(key);
    const qs = totalQs(key);
    return `
      <div class="flk-card" data-action="goto-flk" data-flk="${key}">
        <h2>${d.label}</h2>
        <div class="flk-count">${tests} tests &middot; ${qs.toLocaleString()} questions</div>
        <div class="flk-topics">${d.subjects.join('<br>')}</div>
      </div>`;
  }

  return `
  <div class="home">
    <div class="home-logo">SQE<span>1</span> Practice Tests</div>
    <div class="home-sub">${allTests} tests &middot; ${allQs.toLocaleString()} total questions &middot; SBA format</div>
    <div class="home-cards">
      ${flkCard('flk1')}
      ${flkCard('flk2')}
    </div>
    <div class="home-footer">
      Built for SQE1 revision &middot; All tests run offline in your browser<br>
      <a href="../index.html">&#8592; Revision Hub</a> &nbsp;&middot;&nbsp; <a href="../flashcards/index.html">Flashcards</a>
    </div>
  </div>`;
}

function renderBrowse() {
  const d = TESTS[state.flk];
  const tests = totalTests(state.flk);
  const qs = totalQs(state.flk);
  const genQs = d.generated.reduce((n,t) => n + t.questions, 0);
  const topicQs = d.topic.reduce((n,t) => n + t.questions, 0);

  function testRow(t, type) {
    const icon = type === 'official' ? 'official' : type === 'generated' ? 'generated' : 'topic';
    const iconText = type === 'official' ? '&#9733;' : type === 'generated' ? '&#9881;' : '&#9670;';
    const badgeClass = type === 'official' ? 'full' : type === 'generated' ? 'gen' : 'topic-b';
    let meta = `${t.questions} questions`;
    if (t.sessions) meta += ` &middot; ${t.sessions} sessions with break`;
    const badgeText = type === 'official' ? 'Official' : type === 'generated' ? 'Full Exam' : 'Topic';

    return `
      <a class="test-card" href="${encodeURI(t.file)}" target="_blank" rel="noopener">
        <div class="test-icon ${icon}">${iconText}</div>
        <div class="test-info">
          <div class="test-title">${t.title}</div>
          <div class="test-meta">${meta}</div>
        </div>
        <span class="test-badge ${badgeClass}">${badgeText}</span>
        <span class="test-arrow">&#8594;</span>
      </a>`;
  }

  let officialHtml = d.official.map(t => testRow(t, 'official')).join('');
  let generatedHtml = d.generated.map(t => testRow(t, 'generated')).join('');
  let topicHtml = d.topic.map(t => testRow(t, 'topic')).join('');

  return `
  <div class="browse-wrap">
    <div class="browse-header">
      <button class="btn-back" data-action="go-home">&#8592; Home</button>
      <div>
        <div class="browse-title">${d.label}</div>
        <div class="browse-subtitle">${tests} tests &middot; ${qs.toLocaleString()} questions</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-pill">
        <span class="sp-num">${d.official.length}</span>
        <span class="sp-label">Official</span>
      </div>
      <div class="stat-pill">
        <span class="sp-num">${d.generated.length}</span>
        <span class="sp-label">Full Exams</span>
      </div>
      <div class="stat-pill">
        <span class="sp-num">${d.topic.length}</span>
        <span class="sp-label">Topic Tests</span>
      </div>
      <div class="stat-pill">
        <span class="sp-num">${qs.toLocaleString()}</span>
        <span class="sp-label">Total Qs</span>
      </div>
    </div>

    <div class="section">
      <div class="section-label">&#9733; Official Practice Exam</div>
      ${officialHtml}
    </div>

    <div class="section">
      <div class="section-label">&#9881; Generated Full-Length Exams &mdash; 180 Qs, 2 sessions + break</div>
      ${generatedHtml}
    </div>

    <div class="section">
      <div class="section-label">&#9670; Topic Practice Tests</div>
      ${topicHtml}
    </div>
  </div>`;
}

// ── Events ─────────────────────────────────────────────────────────────────────
let _clickHandler = null;

function bindEvents() {
  if (_clickHandler) document.removeEventListener('click', _clickHandler);

  _clickHandler = function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (a === 'goto-flk') { state.flk = el.dataset.flk; state.view = 'browse'; render(); }
    else if (a === 'go-home') { state.view = 'home'; state.flk = null; render(); }
  };

  document.addEventListener('click', _clickHandler);
}

// ── Init ───────────────────────────────────────────────────────────────────────
render();

</script>
</body>
</html>
