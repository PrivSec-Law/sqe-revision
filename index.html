<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQE1 Flashcards</title>
  <script src="data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Nord Palette ─────────────────────────────────────── */
    :root {
      --n0:  #2E3440;  /* darkest bg        */
      --n1:  #3B4252;  /* dark surface      */
      --n2:  #434C5E;  /* elevated surface  */
      --n3:  #4C566A;  /* borders / muted   */
      --n4:  #D8DEE9;  /* primary text      */
      --n5:  #E5E9F0;  /* light text        */
      --n6:  #ECEFF4;  /* near-white        */
      --n7:  #8FBCBB;  /* teal              */
      --n8:  #88C0D0;  /* ice blue          */
      --n9:  #81A1C1;  /* blue              */
      --n10: #5E81AC;  /* deep blue         */
      --n11: #BF616A;  /* red               */
      --n12: #D08770;  /* orange            */
      --n13: #EBCB8B;  /* yellow            */
      --n14: #A3BE8C;  /* green             */
      --n15: #B48EAD;  /* purple            */

      --green-bg: rgba(163,190,140,0.18);
      --red-bg:   rgba(191,97,106,0.18);
      --shadow:   0 2px 16px rgba(0,0,0,0.35);
      --radius:   10px;
    }

    html { font-size: 21px; }
    @media (max-width: 768px) { body { zoom: 0.5; } }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--n0);
      color: var(--n4);
      min-height: 100vh;
    }

    #app { min-height: 100vh; }

    /* ── HOME ─────────────────────────────────────────────── */
    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(145deg, var(--n0) 0%, var(--n1) 100%);
    }
    .home-logo {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--n6);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .home-logo span { color: var(--n8); }
    .home-sub {
      color: var(--n9);
      font-size: 0.92rem;
      margin-bottom: 48px;
      text-align: center;
    }
    .home-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
    }
    .flk-card {
      background: var(--n1);
      border: 2px solid var(--n3);
      border-radius: 16px;
      padding: 34px 44px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      width: 260px;
      flex-shrink: 0;
      color: var(--n4);
    }
    .flk-card:hover {
      background: var(--n2);
      border-color: var(--n8);
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    .flk-card h2 { font-size: 2rem; font-weight: 800; color: var(--n6); margin-bottom: 6px; }
    .flk-card .flk-count { font-size: 1rem; color: var(--n8); margin-bottom: 10px; }
    .flk-card .flk-topics { font-size: 0.75rem; color: var(--n4); line-height: 1.85; }
    .home-footer {
      margin-top: 40px;
      color: var(--n9);
      font-size: 0.8rem;
      text-align: center;
    }

    /* ── BROWSE ───────────────────────────────────────────── */
    .browse-wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px 40px; }
    .browse-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding-top: 14px;
    }
    .btn-back {
      background: none;
      border: 2px solid var(--n9);
      color: var(--n9);
      padding: 7px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-back:hover { background: var(--n9); color: var(--n0); }
    .browse-title { font-size: 1.45rem; font-weight: 800; color: var(--n6); }
    .browse-subtitle { font-size: 0.82rem; color: var(--n4); }

    .browse-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .btn-mix {
      background: var(--n10);
      color: var(--n6);
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-mix:hover { opacity: 0.85; }
    .btn-nw {
      background: var(--red-bg);
      color: var(--n11);
      border: 2px solid var(--n11);
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-nw:hover { background: var(--n11); color: var(--n6); }

    .subject-block {
      background: var(--n1);
      border-radius: var(--radius);
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--n3);
    }
    .subject-header {
      display: flex;
      align-items: center;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
      gap: 11px;
    }
    .subject-header:hover { background: var(--n2); }
    .subj-check {
      width: 17px; height: 17px;
      accent-color: var(--n8);
      cursor: pointer;
      flex-shrink: 0;
    }
    .subj-name {
      flex: 1;
      font-weight: 700;
      font-size: 0.93rem;
      color: var(--n5);
    }
    .subj-meta {
      font-size: 0.75rem;
      color: var(--n4);
      margin-right: 8px;
      white-space: nowrap;
    }
    .subj-chevron {
      font-size: 0.7rem;
      color: var(--n8);
      background: var(--n2);
      transition: transform 0.2s;
      padding: 6px 8px;
      margin: -6px -8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .subj-chevron:hover { background: var(--n3); color: var(--n6); }
    .subj-chevron.open { transform: rotate(90deg); }

    .chapter-list { border-top: 1px solid var(--n3); display: none; }
    .chapter-list.open { display: block; }
    .chapter-row {
      display: flex;
      align-items: center;
      padding: 9px 16px 9px 38px;
      gap: 11px;
      border-bottom: 1px solid var(--n3);
    }
    .chapter-row:last-child { border-bottom: none; }
    .chapter-row:hover { background: var(--n2); }
    .ch-check {
      width: 15px; height: 15px;
      accent-color: var(--n8);
      cursor: pointer;
      flex-shrink: 0;
    }
    .ch-name { flex: 1; font-size: 0.86rem; color: var(--n4); }
    .ch-count {
      font-size: 0.72rem;
      color: var(--n4);
      background: var(--n0);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .btn-start {
      background: var(--n10);
      color: var(--n6);
      border: none;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-start:hover { opacity: 0.85; }
    .btn-start:disabled {
      background: var(--n2);
      color: var(--n3);
      cursor: not-allowed;
      opacity: 1;
    }

    /* ── SESSION ──────────────────────────────────────────── */
    .session { min-height: 100vh; display: flex; flex-direction: column; background: var(--n0); }
    .session-top {
      background: var(--n1);
      border-bottom: 1px solid var(--n3);
      color: var(--n4);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-exit {
      background: var(--n2);
      border: 1px solid var(--n3);
      color: var(--n4);
      padding: 6px 13px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-exit:hover { background: var(--n3); color: var(--n6); }
    .session-info { flex: 1; min-width: 0; }
    .session-context {
      font-size: 0.72rem;
      color: var(--n9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-source {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--n9);
      margin-bottom: 10px;
      text-align: center;
    }
    .session-counter { font-size: 0.88rem; font-weight: 600; color: var(--n5); }
    .nw-badge { font-size: 0.7rem; color: var(--n11); white-space: nowrap; }
    .progress-bar { height: 3px; background: var(--n2); }
    .progress-fill { height: 100%; background: var(--n8); transition: width 0.3s; }

    .session-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 16px;
    }

    /* Flip card */
    .scene {
      width: 100%;
      max-width: 780px;
      height: 420px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 18px;
    }
    .card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 26px;
      text-align: center;
      box-shadow: 0 6px 28px rgba(0,0,0,0.4);
      overflow-y: hidden;
    }
    .card-front { background: var(--n1); border: 2px solid var(--n9); }
    .face-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 13px;
    }
    .card-front .face-label { color: var(--n8); }
    .card-front .face-text { font-size: 1.02rem; color: var(--n5); line-height: 1.55; }
    .flip-hint { margin-top: 14px; font-size: 0.68rem; color: var(--n9); opacity: 0.7; }

    .card-back { background: var(--n2); border: 2px solid var(--n10); transform: rotateY(180deg); }
    .card-back .face-label { color: var(--n8); }
    .card-back .face-text { font-size: 0.88rem; color: var(--n4); line-height: 1.75; text-align: left; width: 100%; }
    .card-back .face-text strong { color: var(--n8); }
    .card-back .face-text em { color: var(--n7); font-style: italic; }
    .card-back .face-text ul { padding-left: 18px; margin-top: 4px; }
    .card-back .face-text li { margin-bottom: 3px; }

    .session-controls {
      display: flex;
      gap: 9px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
      max-width: 640px;
      width: 100%;
    }
    .btn-nav {
      background: var(--n1);
      border: 2px solid var(--n9);
      color: var(--n9);
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.86rem;
      transition: all 0.15s;
    }
    .btn-nav:hover { background: var(--n9); color: var(--n0); }
    .btn-flip {
      background: var(--n10);
      border: 2px solid var(--n10);
      color: var(--n6);
      padding: 9px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.86rem;
      transition: opacity 0.15s;
    }
    .btn-flip:hover { opacity: 0.85; }
    .btn-shuffle {
      background: var(--n1);
      border: 2px solid var(--n3);
      color: var(--n3);
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      transition: all 0.15s;
    }
    .btn-shuffle:hover { border-color: var(--n8); color: var(--n8); }

    .verdict-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      max-width: 640px;
      width: 100%;
      min-height: 52px;
    }
    .verdict-row.hidden { visibility: hidden; pointer-events: none; }
    .btn-got {
      flex: 1; max-width: 200px;
      background: var(--green-bg);
      border: 2px solid var(--n14);
      color: var(--n14);
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.15s;
    }
    .btn-got:hover { background: var(--n14); color: var(--n0); }
    .btn-work {
      flex: 1; max-width: 200px;
      background: var(--red-bg);
      border: 2px solid var(--n11);
      color: var(--n11);
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.15s;
    }
    .btn-work:hover { background: var(--n11); color: var(--n6); }

    .kbd-hint { font-size: 0.66rem; color: var(--n3); margin-top: 12px; text-align: center; }

    /* ── STATS ────────────────────────────────────────────── */
    .stats-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background: var(--n0);
    }
    .stats-card {
      background: var(--n1);
      border: 1px solid var(--n3);
      border-radius: 16px;
      padding: 34px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stats-title { font-size: 1.55rem; font-weight: 800; color: var(--n6); margin-bottom: 5px; }
    .stats-sub { color: var(--n3); font-size: 0.86rem; margin-bottom: 26px; }
    .stats-row { display: flex; gap: 14px; justify-content: center; margin-bottom: 26px; }
    .stat-box {
      flex: 1;
      border-radius: 10px;
      padding: 15px 10px;
      background: var(--n2);
      border: 1px solid var(--n3);
    }
    .stat-box.green { background: var(--green-bg); border-color: var(--n14); }
    .stat-box.red   { background: var(--red-bg);   border-color: var(--n11); }
    .stat-num { display: block; font-size: 1.9rem; font-weight: 800; color: var(--n8); }
    .stat-box.green .stat-num { color: var(--n14); }
    .stat-box.red   .stat-num { color: var(--n11); }
    .stat-label { font-size: 0.72rem; color: var(--n3); text-transform: uppercase; letter-spacing: 0.5px; }

    .stats-breakdown {
      text-align: left;
      border-top: 1px solid var(--n3);
      padding-top: 18px;
      margin-bottom: 22px;
    }
    .stats-breakdown h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--n3);
      margin-bottom: 10px;
    }
    .bd-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.83rem; }
    .bd-label { flex: 1; color: var(--n4); }
    .bd-got  { color: var(--n14); font-weight: 700; min-width: 40px; text-align: right; }
    .bd-work { color: var(--n11); font-weight: 700; min-width: 40px; text-align: right; }

    .stats-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
    .btn-sa {
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: 2px solid var(--n9);
      transition: all 0.15s;
    }
    .btn-sa.primary { background: var(--n10); color: var(--n6); border-color: var(--n10); }
    .btn-sa.primary:hover { opacity: 0.85; }
    .btn-sa.secondary { background: var(--n1); color: var(--n9); }
    .btn-sa.secondary:hover { background: var(--n9); color: var(--n0); }
    .btn-sa.danger { background: var(--red-bg); color: var(--n11); border-color: var(--n11); }
    .btn-sa.danger:hover { background: var(--n11); color: var(--n6); }

    @media (max-width: 480px) {
      .flk-card { padding: 26px 28px; min-width: 150px; }
      .scene { height: 340px; }
      .card-face { padding: 18px; }
      .stats-row { gap: 8px; }
      .stats-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>

// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  view: 'home',
  flk: null,
  openSubjects: new Set(),
  selection: new Set(),
  needsWork: new Set(JSON.parse(localStorage.getItem('sqe_needs_work') || '[]')),
  session: { cards: [], index: 0, flipped: false, results: [], mode: 'normal' }
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function saveNeedsWork() {
  localStorage.setItem('sqe_needs_work', JSON.stringify([...state.needsWork]));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function flkTotal(flk) {
  return SQE_DATA[flk].subjects.reduce(
    (n, s) => n + s.chapters.reduce((m, c) => m + c.cards.length, 0), 0
  );
}

function nwCountForFlk(flk) {
  let n = 0;
  SQE_DATA[flk].subjects.forEach(s =>
    s.chapters.forEach(ch =>
      ch.cards.forEach((_, i) => { if (state.needsWork.has(`${ch.id}|${i}`)) n++; })
    )
  );
  return n;
}

function selectedCardCount() {
  let n = 0;
  ['flk1','flk2'].forEach(flk =>
    SQE_DATA[flk].subjects.forEach(s =>
      s.chapters.forEach(ch => { if (state.selection.has(ch.id)) n += ch.cards.length; })
    )
  );
  return n;
}

function buildPool(chapterIds) {
  const cards = [];
  ['flk1','flk2'].forEach(flk =>
    SQE_DATA[flk].subjects.forEach(s =>
      s.chapters.forEach(ch => {
        if (chapterIds.has(ch.id)) {
          ch.cards.forEach((c, i) =>
            cards.push({ q: c.q, a: c.a, id: `${ch.id}|${i}`, subjectLabel: s.label, chapterLabel: ch.label })
          );
        }
      })
    )
  );
  return shuffle(cards);
}

function buildNWPool(flk) {
  const cards = [];
  SQE_DATA[flk].subjects.forEach(s =>
    s.chapters.forEach(ch =>
      ch.cards.forEach((c, i) => {
        const id = `${ch.id}|${i}`;
        if (state.needsWork.has(id))
          cards.push({ q: c.q, a: c.a, id, subjectLabel: s.label, chapterLabel: ch.label });
      })
    )
  );
  return shuffle(cards);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function goHome() {
  state.view = 'home'; state.flk = null; state.selection.clear(); render();
}

function goFlk(flk) {
  state.flk = flk; state.view = 'browse'; state.selection.clear(); state.openSubjects.clear(); render();
}

function toggleSubjectOpen(id) {
  state.openSubjects.has(id) ? state.openSubjects.delete(id) : state.openSubjects.add(id);
  render();
}

function toggleSubjectAll(id) {
  const subj = SQE_DATA[state.flk].subjects.find(s => s.id === id);
  if (!subj) return;
  const allSel = subj.chapters.every(ch => state.selection.has(ch.id));
  subj.chapters.forEach(ch => allSel ? state.selection.delete(ch.id) : state.selection.add(ch.id));
  render();
}

function toggleChapter(id) {
  state.selection.has(id) ? state.selection.delete(id) : state.selection.add(id);
  render();
}

function startSession(mode = 'normal') {
  const cards = mode === 'needs_work' ? buildNWPool(state.flk) : buildPool(state.selection);
  if (!cards.length) return;
  state.session = { cards, index: 0, flipped: false, results: [], mode };
  state.view = 'session';
  render();
}

function startMixAll() {
  const all = new Set();
  SQE_DATA[state.flk].subjects.forEach(s => s.chapters.forEach(ch => all.add(ch.id)));
  state.selection = all;
  startSession('normal');
}

function flipCard() {
  state.session.flipped = !state.session.flipped;
  const inner = document.querySelector('.card-inner');
  if (inner) {
    inner.classList.toggle('flipped', state.session.flipped);
    const vr = document.querySelector('.verdict-row');
    if (vr) vr.classList.toggle('hidden', !state.session.flipped);
    const hint = document.querySelector('.flip-hint');
    if (hint) hint.style.visibility = state.session.flipped ? 'hidden' : 'visible';
  }
}

function recordVerdict(outcome) {
  const s = state.session;
  const card = s.cards[s.index];
  s.results.push({ id: card.id, outcome });
  outcome === 'work' ? state.needsWork.add(card.id) : state.needsWork.delete(card.id);
  saveNeedsWork();
  if (s.index < s.cards.length - 1) {
    s.index++; s.flipped = false;
  } else {
    state.view = 'stats';
  }
  render();
}

function moveCard(dir) {
  const s = state.session;
  s.index = Math.max(0, Math.min(s.cards.length - 1, s.index + dir));
  s.flipped = false;
  render();
}

function exitSession() {
  state.view = state.session.results.length > 0 ? 'stats' : 'browse';
  render();
}

function reshuffleSession() {
  state.session.cards = shuffle(state.session.cards);
  state.session.index = 0; state.session.flipped = false; render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const views = { home: renderHome, browse: renderBrowse, session: renderSession, stats: renderStats };
  app.innerHTML = views[state.view]();
  bindEvents();
}

// ── Home ──────────────────────────────────────────────────────────────────────
function renderHome() {
  const t1 = flkTotal('flk1'), t2 = flkTotal('flk2');
  const nw = state.needsWork.size;
  return `
  <div class="home">
    <div class="home-logo">SQE<span>1</span> Flashcards</div>
    <div class="home-sub">${t1 + t2} cards &nbsp;·&nbsp; 165 chapters &nbsp;·&nbsp; 15 subjects</div>
    <div class="home-cards">
      <div class="flk-card" data-action="goto-flk" data-flk="flk1">
        <h2>FLK 1</h2>
        <div class="flk-count">${t1} cards</div>
        <div class="flk-topics">${SQE_DATA.flk1.subjects.map(s => s.label).join('<br>')}</div>
      </div>
      <div class="flk-card" data-action="goto-flk" data-flk="flk2">
        <h2>FLK 2</h2>
        <div class="flk-count">${t2} cards</div>
        <div class="flk-topics">${SQE_DATA.flk2.subjects.map(s => s.label).join('<br>')}</div>
      </div>
    </div>
    ${nw ? `<div class="home-footer">🔴 ${nw} card${nw===1?'':'s'} flagged for review</div>` : ''}
  </div>`;
}

// ── Browse ────────────────────────────────────────────────────────────────────
function renderBrowse() {
  const fd = SQE_DATA[state.flk];
  const total = flkTotal(state.flk);
  const nw = nwCountForFlk(state.flk);
  const selCount = selectedCardCount();

  let subjectsHtml = '';
  fd.subjects.forEach(s => {
    const open = state.openSubjects.has(s.id);
    const subTotal = s.chapters.reduce((n, c) => n + c.cards.length, 0);
    const allSel = s.chapters.length > 0 && s.chapters.every(ch => state.selection.has(ch.id));
    const someSel = !allSel && s.chapters.some(ch => state.selection.has(ch.id));

    let chapHtml = '';
    s.chapters.forEach(ch => {
      const chk = state.selection.has(ch.id) ? 'checked' : '';
      chapHtml += `
        <div class="chapter-row">
          <input type="checkbox" class="ch-check" data-action="toggle-ch" data-id="${ch.id}" ${chk}>
          <span class="ch-name">${ch.label}</span>
          <span class="ch-count">${ch.cards.length} cards</span>
        </div>`;
    });

    subjectsHtml += `
      <div class="subject-block">
        <div class="subject-header" data-action="toggle-subj-all" data-id="${s.id}">
          <input type="checkbox" class="subj-check"
            ${allSel ? 'checked' : ''}
            ${someSel ? 'data-ind="1"' : ''}
            style="pointer-events:none">
          <span class="subj-name">${s.label}</span>
          <span class="subj-meta">${subTotal} cards &middot; ${s.chapters.length} chapters</span>
          <span class="subj-chevron ${open ? 'open' : ''}" data-action="toggle-subj-open" data-id="${s.id}">&#9658;</span>
        </div>
        <div class="chapter-list ${open ? 'open' : ''}">${chapHtml}</div>
      </div>`;
  });

  return `
  <div class="browse-wrap">
    <div class="browse-header">
      <button class="btn-back" data-action="go-home">&#8592; Home</button>
      <div>
        <div class="browse-title">${fd.label}</div>
        <div class="browse-subtitle">${total} cards &middot; ${fd.subjects.length} subjects</div>
      </div>
    </div>
    <div class="browse-actions">
      <button class="btn-mix" data-action="mix-all">&#9889; Mix All ${fd.label} &nbsp;(${total} cards)</button>
      ${nw ? `<button class="btn-nw" data-action="nw-session">&#128308; Needs Work (${nw})</button>` : ''}
      <button class="btn-start" data-action="start-session" ${selCount === 0 ? 'disabled' : ''}>
        ${selCount > 0 ? `Start Session (${selCount}) &#8594;` : 'Start Session &#8594;'}
      </button>
    </div>
    ${subjectsHtml}
  </div>`;
}

// ── Session ───────────────────────────────────────────────────────────────────
function renderSession() {
  const s = state.session;
  const card = s.cards[s.index];
  const pct = ((s.index + 1) / s.cards.length * 100).toFixed(1);
  const isNW = state.needsWork.has(card.id);

  return `
  <div class="session">
    <div class="session-top">
      <button class="btn-exit" data-action="exit-session">&#10005; Exit</button>
      <div class="session-info">
        <div class="session-context">${card.subjectLabel} &middot; ${card.chapterLabel}</div>
        <div class="session-counter">Card ${s.index + 1} of ${s.cards.length}</div>
      </div>
      ${isNW ? '<span class="nw-badge">&#128308; Needs Work</span>' : ''}
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>
    <div class="session-main">
      <div class="card-source">${card.subjectLabel} &nbsp;·&nbsp; ${card.chapterLabel}</div>
      <div class="scene" data-action="flip-card">
        <div class="card-inner ${s.flipped ? 'flipped' : ''}">
          <div class="card-face card-front">
            <div class="face-label">Question</div>
            <div class="face-text">${card.q}</div>
            <div class="flip-hint">Click &middot; Space &middot; Enter to reveal</div>
          </div>
          <div class="card-face card-back">
            <div class="face-label">Answer</div>
            <div class="face-text">${card.a}</div>
          </div>
        </div>
      </div>
      <div class="session-controls">
        <button class="btn-nav" data-action="prev-card">&#8592; Prev</button>
        <button class="btn-flip" data-action="flip-card">Flip</button>
        <button class="btn-nav" data-action="next-card">Next &#8594;</button>
        <button class="btn-shuffle" data-action="reshuffle">&#8644; Shuffle</button>
      </div>
      <div class="verdict-row ${s.flipped ? '' : 'hidden'}">
        <button class="btn-got" data-action="verdict-got">&#10003; Got it</button>
        <button class="btn-work" data-action="verdict-work">&#10007; Needs Work</button>
      </div>
      <div class="kbd-hint">&#8592; &#8594; navigate &nbsp;&middot;&nbsp; Space / Enter flip &nbsp;&middot;&nbsp; G = got it &nbsp;&middot;&nbsp; W = needs work</div>
    </div>
  </div>`;
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const res = state.session.results;
  const total = res.length;
  const got  = res.filter(r => r.outcome === 'got').length;
  const work = res.filter(r => r.outcome === 'work').length;
  const skipped = state.session.cards.length - total;
  const pct = total ? Math.round((got / total) * 100) : 0;

  // Breakdown by subject
  const bySubject = {};
  res.forEach(r => {
    const card = state.session.cards.find(c => c.id === r.id);
    if (!card) return;
    if (!bySubject[card.subjectLabel]) bySubject[card.subjectLabel] = { got: 0, work: 0 };
    bySubject[card.subjectLabel][r.outcome === 'got' ? 'got' : 'work']++;
  });

  let breakdown = '';
  Object.entries(bySubject).forEach(([label, counts]) => {
    breakdown += `
      <div class="bd-row">
        <span class="bd-label">${label}</span>
        <span class="bd-got">&#10003; ${counts.got}</span>
        <span class="bd-work">&#10007; ${counts.work}</span>
      </div>`;
  });

  const nw = nwCountForFlk(state.flk);

  return `
  <div class="stats-wrap">
    <div class="stats-card">
      <div class="stats-title">Session Complete</div>
      <div class="stats-sub">
        ${total} card${total !== 1 ? 's' : ''} reviewed
        ${skipped > 0 ? ` &middot; ${skipped} skipped` : ''}
        &middot; ${pct}% confident
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-num">${total}</span>
          <span class="stat-label">Reviewed</span>
        </div>
        <div class="stat-box green">
          <span class="stat-num">${got}</span>
          <span class="stat-label">Got It</span>
        </div>
        <div class="stat-box red">
          <span class="stat-num">${work}</span>
          <span class="stat-label">Needs Work</span>
        </div>
      </div>
      ${breakdown ? `<div class="stats-breakdown"><h4>By Subject</h4>${breakdown}</div>` : ''}
      <div class="stats-actions">
        ${nw ? `<button class="btn-sa danger" data-action="retry-nw">&#128308; Review ${nw} Flagged</button>` : ''}
        <button class="btn-sa secondary" data-action="back-browse">&#8592; Topics</button>
        <button class="btn-sa primary" data-action="restart">&#8635; Restart</button>
      </div>
    </div>
  </div>`;
}

// ── Events ────────────────────────────────────────────────────────────────────
let _clickHandler = null;
let _keyHandler   = null;
let _touchHandler = null;
let _touchStart   = null;

function bindEvents() {
  if (_clickHandler) document.removeEventListener('click', _clickHandler);
  if (_keyHandler)   document.removeEventListener('keydown', _keyHandler);
  if (_touchHandler) {
    document.removeEventListener('touchstart', _touchHandler.start);
    document.removeEventListener('touchend',   _touchHandler.end);
  }

  // Set indeterminate state on checkboxes
  document.querySelectorAll('[data-ind="1"]').forEach(el => { el.indeterminate = true; });

  _clickHandler = function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (a === 'goto-flk')         goFlk(el.dataset.flk);
    else if (a === 'go-home')     goHome();
    else if (a === 'toggle-subj-open') toggleSubjectOpen(el.dataset.id);
    else if (a === 'toggle-subj-all')  toggleSubjectAll(el.dataset.id);
    else if (a === 'toggle-ch')   toggleChapter(el.dataset.id);
    else if (a === 'mix-all')     startMixAll();
    else if (a === 'nw-session')  startSession('needs_work');
    else if (a === 'start-session') startSession();
    else if (a === 'flip-card')   flipCard();
    else if (a === 'prev-card')   moveCard(-1);
    else if (a === 'next-card')   moveCard(1);
    else if (a === 'reshuffle')   reshuffleSession();
    else if (a === 'exit-session') exitSession();
    else if (a === 'verdict-got') recordVerdict('got');
    else if (a === 'verdict-work') recordVerdict('work');
    else if (a === 'back-browse') { state.view = 'browse'; render(); }
    else if (a === 'restart')     { const m = state.session.mode; if (m === 'needs_work') startSession('needs_work'); else startSession(); }
    else if (a === 'retry-nw')    startSession('needs_work');
  };

  _keyHandler = function(e) {
    if (state.view !== 'session') return;
    if (e.target.tagName === 'INPUT') return;
    const s = state.session;
    if (e.key === 'ArrowRight')               moveCard(1);
    else if (e.key === 'ArrowLeft')           moveCard(-1);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
    else if ((e.key === 'g' || e.key === 'G') && s.flipped) recordVerdict('got');
    else if ((e.key === 'w' || e.key === 'W') && s.flipped) recordVerdict('work');
  };

  _touchHandler = {
    start: function(e) {
      if (state.view !== 'session') return;
      const t = e.touches[0];
      _touchStart = { x: t.clientX, y: t.clientY };
    },
    end: function(e) {
      if (state.view !== 'session' || !_touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - _touchStart.x;
      const dy = t.clientY - _touchStart.y;
      _touchStart = null;
      // Only act if horizontal swipe is dominant and long enough
      if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return;
      if (Math.abs(dx) >= Math.abs(dy)) {
        // Horizontal — navigate
        if (dx < -40) moveCard(1);
        else if (dx > 40) moveCard(-1);
      } else {
        // Vertical swipe up — flip
        if (dy < -40) flipCard();
      }
    }
  };

  document.addEventListener('click', _clickHandler);
  document.addEventListener('keydown', _keyHandler);
  document.addEventListener('touchstart', _touchHandler.start, { passive: true });
  document.addEventListener('touchend',   _touchHandler.end,   { passive: true });
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
